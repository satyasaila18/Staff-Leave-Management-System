<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Leave</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#dbeafe,#eef2ff,#f8fafc);
        }

        .container{
            width:450px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:25px;
        }

        label{
            display:block;
            font-weight:bold;
            color:#444;
            margin-bottom:6px;
        }

        select,
        input,
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            margin-bottom:15px;
            font-size:15px;
            outline:none;
        }

        select:focus,
        input:focus,
        textarea:focus{
            border-color:#256300;
        }

        textarea{
            resize:none;
            height:100px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            transition:0.3s;
        }

        button:hover{
            background:#1e3a8a;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }

        .back:hover{
            text-decoration:underline;
            color: #256300;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Apply Leave</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Leave Type</label>
        <select name="leave_type" required>
            <option value="">Select Leave Type</option>
            <option value="Sick Leave">Sick Leave</option>
            <option value="Casual Leave">Casual Leave</option>
            <option value="Emergency Leave">Emergency Leave</option>
        </select>

        <label>Start Date</label>
        <input type="date" name="start" required>

        <label>End Date</label>
        <input type="date" name="end" required>

        <label>Reason</label>
        <textarea name="reason" placeholder="Enter your reason..." required></textarea>

        <button type="submit">Submit Leave Request</button>
    </form>

    <a href="{% url 'staff_dashboard' %}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
