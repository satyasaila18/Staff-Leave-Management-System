<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#eef2ff,#dbeafe,#f8fafc);
            min-height:100vh;
        }

        nav{
            background:#1e3a8a;
            color:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px 50px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        nav h2{
            font-size:28px;
            letter-spacing:1px;
        }

        nav a{
            text-decoration:none;
            color:white;
            background:#2563eb;
            padding:10px 18px;
            border-radius:8px;
            transition:.3s;
        }

        nav a:hover{
            background:white;
            color:#1e3a8a;
        }

        h3{
            text-align:center;
            margin-top:35px;
            font-size:32px;
            color:#1e3a8a;
        }

        .container{
            width:90%;
            margin:50px auto;
            display:flex;
            justify-content:center;
            gap:40px;
            flex-wrap:wrap;
        }

        .card{
            width:320px;
            background:white;
            padding:30px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 8px 20px rgba(0,0,0,.15);
            transition:.4s;
        }

        .card:hover{
            transform:translateY(-10px);
            box-shadow:0 12px 25px rgba(0,0,0,.25);
        }

        .card h5{
            font-size:26px;
            color:#1e3a8a;
            margin-bottom:15px;
        }

        .card p{
            color:gray;
            margin-bottom:25px;
            font-size:16px;
        }

        .card a{
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:12px 25px;
            border-radius:8px;
            display:inline-block;
            transition:.3s;
        }

        .card a:hover{
            background:#1e3a8a;
        }
    </style>

</head>
<body>

    <nav>
        <h2>SLMS - Staff</h2>
        <a href="{% url 'logout' %}">Logout</a>
    </nav>

    <h3>Welcome, {{request.user.username}}</h3>

    <div class="container">

        <div class="card">
            <h5>Apply Leave</h5>
            <p>Submit a new leave request.</p>
            <a href="{% url 'apply_leave' %}">Apply</a>
        </div>

        <div class="card">
            <h5>Leave Status</h5>
            <p>View the status of your leave requests.</p>
            <a href="{% url 'my_leaves' %}">View</a>
        </div>

    </div>

</body>
</html>
