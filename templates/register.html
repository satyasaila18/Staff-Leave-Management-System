<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLMS | Register</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .container{
            width:430px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.25);
            text-align:center;
        }

        h1{
            color:#5b21b6;
            margin-bottom:8px;
        }

        h2{
            color:#666;
            font-size:20px;
            margin-bottom:25px;
        }

        label{
            display:block;
            text-align:left;
            font-weight:bold;
            margin-top:12px;
            margin-bottom:5px;
            color:#444;
        }

        input,
        select{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            outline:none;
            font-size:15px;
        }

        input:focus,
        select:focus{
            border-color:#764ba2;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            background:#764ba2;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
            transition:0.3s;
        }

        button:hover{
            background:#5b21b6;
        }

        p{
            margin-top:18px;
            color:#555;
            font-size:14px;
        }

        a{
            text-decoration:none;
            color:#5b21b6;
            font-weight:bold;
        }

        a:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>SLMS Registration</h1>
        <h2>Staff Leave Management System</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>

            <label>Role</label>
            <select name="role" required>
                <option value="">Select Role</option>
                <option value="admin">Admin</option>
                <option value="staff">Staff</option>
            </select>

            <p>Admin can manage staff and approve leave requests.</p>

            <button type="submit">Register</button>
        </form>

        <p>
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

</body>
</html>
