<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Staff</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#eef2ff,#dbeafe,#f8fafc);
            padding:40px;
        }

        .container{
            width:80%;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
        }

        h2{
            color:#1e3a8a;
            margin-bottom:20px;
            text-align:center;
        }

        .top-btn{
            display:inline-block;
            margin-bottom:20px;
            padding:10px 18px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:8px;
            transition:0.3s;
        }

        .top-btn:hover{
            background:#1e3a8a;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:10px;
        }

        th{
            background:#1e3a8a;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f3f4f6;
        }

        .edit{
            background:#22c55e;
            color:white;
            padding:7px 15px;
            text-decoration:none;
            border-radius:5px;
            margin-right:10px;
        }

        .delete{
            background:#ef4444;
            color:white;
            padding:7px 15px;
            text-decoration:none;
            border-radius:5px;
        }

        .edit:hover{
            background:#15803d;
        }

        .delete:hover{
            background:#b91c1c;
        }

        .back{
            display:inline-block;
            margin-top:25px;
            text-decoration:none;
            background:#6b7280;
            color:white;
            padding:10px 18px;
            border-radius:8px;
            transition:0.3s;
        }

        .back:hover{
            background:#374151;
        }
    </style>

</head>
<body>

<div class="container">

    <h2>Manage Staff</h2>

    <a href="{% url 'add_staff' %}" class="top-btn">+ Add Staff</a>

    <table>
        <tr>
            <th>Username</th>
            <th>Actions</th>
        </tr>

        {% for i in staff_list %}
        <tr>
            <td>{{ i.username }}</td>

            <td>
                <a href="{% url 'edit_staff' i.id %}" class="edit">Edit</a>

                <a href="{% url 'delete_staff' i.id %}" class="delete"
                   onclick="return confirm('Are you sure to delete?')">
                    Delete
                </a>
            </td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="2">No staff found.</td>
        </tr>
        {% endfor %}

    </table>

    <a href="{% url 'admin_dashboard' %}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
