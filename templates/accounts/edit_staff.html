<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Staff</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#eef2ff,#dbeafe,#f8fafc);
        }

        .container{
            width:420px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
            text-align:center;
        }

        h1{
            color:#1e3a8a;
            margin-bottom:25px;
            font-size:28px;
        }

        label{
            display:block;
            text-align:left;
            margin-bottom:5px;
            font-weight:bold;
            color:#444;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            margin-bottom:18px;
            font-size:15px;
            outline:none;
        }

        input:focus{
            border-color:#2563eb;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            transition:0.3s;
        }

        button:hover{
            background:#1e3a8a;
        }

        .back{
            display:inline-block;
            margin-top:20px;
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }

        .back:hover{
            text-decoration:underline;
        }
    </style>

</head>
<body>

    <div class="container">

        <h1>Edit {{ user.username }}'s Details</h1>

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" value="{{ staff.username }}" required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Leave blank to keep current password">

            <button type="submit">Update Staff</button>
        </form>

        <a href="{% url 'manage_staff' %}" class="back">
            ← Back to Manage Staff
        </a>

    </div>

</body>
</html>
